name: Build libjxl

# - pull_request / workflow_dispatch: build + test, packages kept as artifacts
# - push to main: same, and if the tag v<LIBJXL_VERSION>-<PACKAGE_REVISION>
#   (see build.env) does not exist yet, create it together with a GitHub
#   release carrying libjxl-native-*.tgz (x64 + arm64 bundled),
#   libjxl-native-linux-{x64,arm64}-*.tgz and libjxl-wasm-*.tgz. So releasing
#   is: bump build.env in a PR, merge.
# - push of a matching tag: build + release (manual alternative)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only superseded PR runs are cancelled; a push to main may be a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      libjxl_version: ${{ steps.env.outputs.LIBJXL_VERSION }}
      package_version: ${{ steps.env.outputs.PACKAGE_VERSION }}
      emsdk_version: ${{ steps.env.outputs.EMSDK_VERSION }}
      release: ${{ steps.env.outputs.RELEASE }}
      tag: ${{ steps.env.outputs.TAG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: env
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          source build.env
          version="${LIBJXL_VERSION}-${PACKAGE_REVISION}"
          tag="v${version}"
          release=false
          if [[ "$REF_TYPE" == tag ]]; then
            if [[ "$REF_NAME" != "$tag" ]]; then
              echo "::error::tag $REF_NAME does not match build.env (expected $tag)"
              exit 1
            fi
            release=true
          elif [[ "$EVENT" == push && "$REF_NAME" == main ]]; then
            if gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
              echo "$tag already exists; not releasing"
            else
              release=true
            fi
          fi
          {
            echo "LIBJXL_VERSION=${LIBJXL_VERSION}"
            echo "PACKAGE_VERSION=${version}"
            echo "EMSDK_VERSION=${EMSDK_VERSION}"
            echo "TAG=${tag}"
            echo "RELEASE=${release}"
          } | tee -a "$GITHUB_OUTPUT"

  native:
    needs: config
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # Release builds are always built from scratch.
      USE_CCACHE: ${{ needs.config.outputs.release == 'true' && '0' || '1' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache
      - if: env.USE_CCACHE == '1'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-native-${{ matrix.arch }}-${{ hashFiles('build.env') }}-${{ github.run_id }}
          restore-keys: |
            ccache-native-${{ matrix.arch }}-${{ hashFiles('build.env') }}-
            ccache-native-${{ matrix.arch }}-
      - name: Fetch libjxl
        run: scripts/fetch-libjxl.sh work/libjxl
      - name: Build
        run: |
          scripts/build-native.sh work/libjxl ${{ matrix.arch }} out/native-${{ matrix.arch }}
          if [[ "$USE_CCACHE" == 1 ]]; then ccache --show-stats; fi
      - name: Smoke test
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          dir="$PWD/out/native-$ARCH"
          gcc -O2 -Wall tests/smoke.c -I"$dir/include" -L"$dir/lib" \
            -ljxl -ljxl_threads -Wl,-rpath,"$dir/lib" -o work/smoke
          work/smoke 0
          work/smoke 4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.arch }}
          path: out/native-${{ matrix.arch }}
          if-no-files-found: error

  wasm:
    needs: config
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # st: single-threaded, mt: pthreads. Each is a full libjxl build.
        variant: [st, mt]
    env:
      USE_CCACHE: ${{ needs.config.outputs.release == 'true' && '0' || '1' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache
      - if: env.USE_CCACHE == '1'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-wasm-${{ matrix.variant }}-${{ hashFiles('build.env') }}-${{ github.run_id }}
          restore-keys: |
            ccache-wasm-${{ matrix.variant }}-${{ hashFiles('build.env') }}-
            ccache-wasm-${{ matrix.variant }}-
      - name: Fetch libjxl
        run: scripts/fetch-libjxl.sh work/libjxl
      - name: Install emsdk
        env:
          EMSDK_VERSION: ${{ needs.config.outputs.emsdk_version }}
        run: |
          git -c advice.detachedHead=false clone --quiet --depth 1 \
            --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git work/emsdk
          work/emsdk/emsdk install "$EMSDK_VERSION"
          work/emsdk/emsdk activate "$EMSDK_VERSION"
      - name: Build
        run: |
          source work/emsdk/emsdk_env.sh
          emcc --version
          scripts/build-wasm.sh work/libjxl ${{ matrix.variant }} out/wasm-${{ matrix.variant }}
          if [[ "$USE_CCACHE" == 1 ]]; then ccache --show-stats; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-${{ matrix.variant }}
          path: out/wasm-${{ matrix.variant }}
          if-no-files-found: error

  package:
    needs: [config, native, wasm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-x64
          path: out/native-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-arm64
          path: out/native-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-st
          path: out/wasm-st
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-mt
          path: out/wasm-mt
      - name: Pack
        run: |
          node scripts/pack.mjs native dist out/native-x64 out/native-arm64
          node scripts/pack.mjs native-arch dist x64 out/native-x64
          node scripts/pack.mjs native-arch dist arm64 out/native-arm64
          node scripts/pack.mjs wasm dist out/wasm-st out/wasm-mt
          for f in dist/*.tgz; do
            echo "== $f"
            tar tzvf "$f"
          done
          (cd dist && sha256sum *.tgz | tee SHA256SUMS)
      - name: Test installed packages
        env:
          VERSION: ${{ needs.config.outputs.package_version }}
        run: |
          mkdir -p work/consumer
          cd work/consumer
          npm init -y > /dev/null
          npm install --no-audit --no-fund \
            "$GITHUB_WORKSPACE/dist/libjxl-native-$VERSION.tgz" \
            "$GITHUB_WORKSPACE/dist/libjxl-wasm-$VERSION.tgz"

          inc="$(node -p "require('libjxl-native').includeDir")"
          lib="$(node -p "require('libjxl-native').libDir()")"
          node -p "require('libjxl-native').libraryPath('jxl')"
          gcc -O2 "$GITHUB_WORKSPACE/tests/smoke.c" -I"$inc" -L"$lib" \
            -ljxl -ljxl_threads -Wl,-rpath,"$lib" -o smoke
          ./smoke 4

          # Single-platform package for the runner's architecture; the one for
          # the other architecture must be refused by os/cpu.
          npm install --no-audit --no-fund \
            "$GITHUB_WORKSPACE/dist/libjxl-native-linux-x64-$VERSION.tgz"
          arch_lib="$(node -p "require('libjxl-native-linux-x64').libDir()")"
          gcc -O2 "$GITHUB_WORKSPACE/tests/smoke.c" \
            -I"$(node -p "require('libjxl-native-linux-x64').includeDir")" -L"$arch_lib" \
            -ljxl -ljxl_threads -Wl,-rpath,"$arch_lib" -o smoke-x64
          ./smoke-x64 4
          if npm install --no-audit --no-fund \
            "$GITHUB_WORKSPACE/dist/libjxl-native-linux-arm64-$VERSION.tgz" 2> arm64.log; then
            echo "::error::arm64 package was installed on x64"
            exit 1
          fi
          grep -q EBADPLATFORM arm64.log

          cp "$GITHUB_WORKSPACE/tests/wasm-smoke.mjs" .
          node wasm-smoke.mjs libjxl-wasm
          node wasm-smoke.mjs libjxl-wasm/mt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist
          if-no-files-found: error

  release:
    if: needs.config.outputs.release == 'true'
    needs: [config, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.config.outputs.tag }}
          LIBJXL_VERSION: ${{ needs.config.outputs.libjxl_version }}
          VERSION: ${{ needs.config.outputs.package_version }}
          EMSDK_VERSION: ${{ needs.config.outputs.emsdk_version }}
        run: |
          base="https://github.com/${GH_REPO}/releases/download/${TAG}"
          cat > notes.md <<EOF
          Unofficial builds of [libjxl v${LIBJXL_VERSION}](https://github.com/libjxl/libjxl/releases/tag/v${LIBJXL_VERSION}) from unmodified upstream sources. Not affiliated with or endorsed by the libjxl authors.

          | File | Contents |
          | --- | --- |
          | \`libjxl-native-linux-x64-${VERSION}.tgz\` | Shared libraries for Linux x64 only (glibc, built on Ubuntu 24.04) + headers |
          | \`libjxl-native-linux-arm64-${VERSION}.tgz\` | Same for Linux arm64 only |
          | \`libjxl-native-${VERSION}.tgz\` | Both architectures bundled in one package |
          | \`libjxl-wasm-${VERSION}.tgz\` | WebAssembly modules (single-threaded and pthreads, SIMD128), Emscripten ${EMSDK_VERSION} |

          \`\`\`sh
          npm install ${base}/libjxl-native-${VERSION}.tgz
          # or only one architecture (os/cpu fields let package managers skip the other):
          npm install ${base}/libjxl-native-linux-x64-${VERSION}.tgz
          npm install ${base}/libjxl-wasm-${VERSION}.tgz
          \`\`\`

          Each package contains the license files of all bundled code in \`licenses/\` (libjxl BSD-3-Clause + PATENTS, brotli, highway, skcms, and for wasm the Emscripten runtime / libc++ / musl).
          EOF
          # For a push to main this also creates the tag on the built commit.
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            target=(--verify-tag)
          else
            target=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" "${target[@]}" --title "libjxl ${VERSION}" --notes-file notes.md \
            dist/libjxl-native-${VERSION}.tgz dist/libjxl-native-linux-x64-${VERSION}.tgz \
            dist/libjxl-native-linux-arm64-${VERSION}.tgz dist/libjxl-wasm-${VERSION}.tgz dist/SHA256SUMS
