name: Build libjxl

# - pull_request / workflow_dispatch: build + test, packages kept as artifacts
# - tag v<LIBJXL_VERSION>-<PACKAGE_REVISION> (see build.env): also create a
#   GitHub release with libjxl-native-*.tgz and libjxl-wasm-*.tgz
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      libjxl_version: ${{ steps.env.outputs.LIBJXL_VERSION }}
      package_version: ${{ steps.env.outputs.PACKAGE_VERSION }}
      emsdk_version: ${{ steps.env.outputs.EMSDK_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: env
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          source build.env
          version="${LIBJXL_VERSION}-${PACKAGE_REVISION}"
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v${version}" ]]; then
            echo "::error::tag $REF_NAME does not match build.env (expected v${version})"
            exit 1
          fi
          {
            echo "LIBJXL_VERSION=${LIBJXL_VERSION}"
            echo "PACKAGE_VERSION=${version}"
            echo "EMSDK_VERSION=${EMSDK_VERSION}"
          } | tee -a "$GITHUB_OUTPUT"

  native:
    needs: config
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          pkgs=(ninja-build)
          if [[ "$ARCH" == arm64 ]]; then
            pkgs+=(gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user)
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${pkgs[@]}"
      - name: Fetch libjxl
        run: scripts/fetch-libjxl.sh work/libjxl
      - name: Build
        run: scripts/build-native.sh work/libjxl ${{ matrix.arch }} out/native-${{ matrix.arch }}
      - name: Smoke test
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          dir="$PWD/out/native-$ARCH"
          if [[ "$ARCH" == arm64 ]]; then
            cc=aarch64-linux-gnu-gcc
            run=(qemu-aarch64 -L /usr/aarch64-linux-gnu)
          else
            cc=gcc
            run=()
          fi
          $cc -O2 -Wall tests/smoke.c -I"$dir/include" -L"$dir/lib" \
            -ljxl -ljxl_threads -Wl,-rpath,"$dir/lib" -o work/smoke
          "${run[@]}" work/smoke 0
          "${run[@]}" work/smoke 4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.arch }}
          path: out/native-${{ matrix.arch }}
          if-no-files-found: error

  wasm:
    needs: config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
      - name: Fetch libjxl
        run: scripts/fetch-libjxl.sh work/libjxl
      - name: Install emsdk
        env:
          EMSDK_VERSION: ${{ needs.config.outputs.emsdk_version }}
        run: |
          git -c advice.detachedHead=false clone --quiet --depth 1 \
            --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git work/emsdk
          work/emsdk/emsdk install "$EMSDK_VERSION"
          work/emsdk/emsdk activate "$EMSDK_VERSION"
      - name: Build
        run: |
          source work/emsdk/emsdk_env.sh
          emcc --version
          scripts/build-wasm.sh work/libjxl out/wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm
          path: out/wasm
          if-no-files-found: error

  package:
    needs: [config, native, wasm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-x64
          path: out/native-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-arm64
          path: out/native-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm
          path: out/wasm
      - name: Pack
        run: |
          node scripts/pack.mjs native dist out/native-x64 out/native-arm64
          node scripts/pack.mjs wasm dist out/wasm
          for f in dist/*.tgz; do
            echo "== $f"
            tar tzvf "$f"
          done
          (cd dist && sha256sum *.tgz | tee SHA256SUMS)
      - name: Test installed packages
        env:
          VERSION: ${{ needs.config.outputs.package_version }}
        run: |
          mkdir -p work/consumer
          cd work/consumer
          npm init -y > /dev/null
          npm install --no-audit --no-fund \
            "$GITHUB_WORKSPACE/dist/libjxl-native-$VERSION.tgz" \
            "$GITHUB_WORKSPACE/dist/libjxl-wasm-$VERSION.tgz"

          inc="$(node -p "require('libjxl-native').includeDir")"
          lib="$(node -p "require('libjxl-native').libDir()")"
          node -p "require('libjxl-native').libraryPath('jxl')"
          gcc -O2 "$GITHUB_WORKSPACE/tests/smoke.c" -I"$inc" -L"$lib" \
            -ljxl -ljxl_threads -Wl,-rpath,"$lib" -o smoke
          ./smoke 4

          cp "$GITHUB_WORKSPACE/tests/wasm-smoke.mjs" .
          node wasm-smoke.mjs libjxl-wasm
          node wasm-smoke.mjs libjxl-wasm/mt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [config, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          LIBJXL_VERSION: ${{ needs.config.outputs.libjxl_version }}
          VERSION: ${{ needs.config.outputs.package_version }}
          EMSDK_VERSION: ${{ needs.config.outputs.emsdk_version }}
        run: |
          base="https://github.com/${GH_REPO}/releases/download/${TAG}"
          cat > notes.md <<EOF
          Unofficial builds of [libjxl v${LIBJXL_VERSION}](https://github.com/libjxl/libjxl/releases/tag/v${LIBJXL_VERSION}) from unmodified upstream sources. Not affiliated with or endorsed by the libjxl authors.

          | File | Contents |
          | --- | --- |
          | \`libjxl-native-${VERSION}.tgz\` | Shared libraries for Linux x64 / arm64 (glibc, built on Ubuntu 24.04) + headers |
          | \`libjxl-wasm-${VERSION}.tgz\` | WebAssembly modules (single-threaded and pthreads, SIMD128), Emscripten ${EMSDK_VERSION} |

          \`\`\`sh
          npm install ${base}/libjxl-native-${VERSION}.tgz
          npm install ${base}/libjxl-wasm-${VERSION}.tgz
          \`\`\`

          Each package contains the license files of all bundled code in \`licenses/\` (libjxl BSD-3-Clause + PATENTS, brotli, highway, skcms, and for wasm the Emscripten runtime / libc++ / musl).
          EOF
          gh release create "$TAG" --verify-tag --title "libjxl ${VERSION}" --notes-file notes.md \
            dist/libjxl-native-${VERSION}.tgz dist/libjxl-wasm-${VERSION}.tgz dist/SHA256SUMS
